[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acacia"
version = "0.1.0"
description = "Multi-agent ATC/Pilot/Ground disruption negotiation (Acacia Statement 2)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.5",
    "anthropic>=0.40",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
    "graphviz>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.setuptools]
packages = ["acacia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
